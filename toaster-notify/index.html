<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toaster Notification Example</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: rgb(191, 164, 250);
      }
      .parent {
        position: fixed;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .toaster {
        width: 200px;
        height: 30px;
        font-size: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 5px;
        background-color: rgb(26, 143, 0);
        color: white;
        user-select: none;
      }
    </style>
  </head>
  <body>
    
    <div class="parent"></div>

    <script>

      
function createToaster(configs) {
  return function (notification) {
    const div = document.createElement("div");
    div.classList.add("toaster");
    div.textContent = notification;
    const parent = document.querySelector(".parent");
    parent.appendChild(div);
    const parentPosition = parent.style;

    configs.positionX === "left"
      ? (parentPosition.left = "5%")
      : (parentPosition.right = "5%");

    configs.positionY === "bottom"
      ? (parentPosition.bottom = "5%")
      : (parentPosition.top = "5%");

    setTimeout(() => {
      parent.removeChild(div);
    }, configs.duration * 1000);
  };
}

const toaster = createToaster({
  positionX: "right",
  positionY: "top",
  duration: 6,
});

toaster("hello world!");
setTimeout(() => {
  toaster("download Completed");
}, 3 * 1000);

      
    </script>
  </body>
</html>
